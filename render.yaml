services:
  - type: web
    name: emotigift-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://emotigift.vercel.app,https://localhost:3000,http://localhost:3000"
      - key: ENVIRONMENT
        value: "production"
    rootDir: backend